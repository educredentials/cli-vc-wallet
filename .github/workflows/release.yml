name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build release
        run: cargo build --release
      - name: Rename binary
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   suffix="linux" ;;
            macOS)   suffix="macos" ;;
            Windows) suffix="windows.exe" ;;
          esac
          cp target/release/cli-vc-wallet "cli-vc-wallet-${suffix}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-vc-wallet-${{ runner.os }}
          path: cli-vc-wallet-*
          compression-level: 9

  publish:
    name: Publish to GitHub
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/cli-vc-wallet-*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
